[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[project]
name = "ade-app"
version = "0.2.0"
description = "GPT-6 Sol scanned-document parser producing layout-aware Markdown"
requires-python = ">=3.13.15,<3.14"
dependencies = [
  "markdown-it-py>=4.0.0",
  "nh3>=0.3.2",
  "openai>=3.6.0",
  "pillow>=12.3.0",
  "pydantic>=2.13.5",
  "pymupdf>=1.28.2",
  "streamlit[pdf]>=1.62.0",
]

[project.scripts]
ade-parse = "ade_app.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.16.5", "ty>=0.0.76"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.13"
